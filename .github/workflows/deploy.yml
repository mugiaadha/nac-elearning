name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, xml, ctype, json, gd, pdo_mysql, curl, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Deploy to VPS via rsync
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_IP }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          TARGET: /var/www/laravel-app
          SOURCE: .
          EXCLUDE: .env, storage, .git
          ARGS: -avz --delete
          SCRIPT_AFTER: |
            sudo chown -R www-data:www-data /var/www/laravel-app
            sudo chmod -R 755 /var/www/laravel-app
            cd /var/www/laravel-app
            php artisan down
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link
            php artisan optimize
            php artisan db:optimize --check
            php artisan db:optimize --analyze
            php artisan db:optimize --indexes
            php artisan db:optimize --foreign-keys
            php artisan migrate:fresh --seed
            php artisan clear-compiled
            php artisan up
