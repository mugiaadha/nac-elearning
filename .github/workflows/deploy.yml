name: Deploy Laravel to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, xml, ctype, json, gd, pdo_mysql, curl, zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Deploy to VPS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          ssh_private_key: ${{ secrets.SERVER_SSH_KEY }}
          local_path: "./*"
          remote_path: "/home/clenicapp.com/public_html/ws.clenicapp.com"
          sftp_only: true
          args: "-o ConnectTimeout=5"
          delete_remote_files: false

      - name: Run Post-Deploy Commands via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/clenicapp.com/public_html/ws.clenicapp.com

            # Set kepemilikan ke www-data (user web server)
            sudo chown -R www-data:www-data /home/clenicapp.com/public_html/ws.clenicapp.com

            # Atur permission file & folder
            sudo find /home/clenicapp.com/public_html/ws.clenicapp.com -type f -exec chmod 644 {} \;
            sudo find /home/clenicapp.com/public_html/ws.clenicapp.com -type d -exec chmod 755 {} \;

            # Kasih akses tulis untuk storage & bootstrap/cache
            sudo chgrp -R www-data storage bootstrap/cache
            sudo chmod -R ug+rwx storage bootstrap/cache

            # Maintenance mode ON
            php artisan down || true

            # Migrasi & optimize
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link
            php artisan optimize:clear
            php artisan optimize

            # Maintenance mode OFF
            php artisan up
