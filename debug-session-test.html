<!DOCTYPE html>
<html>
<head>
    <title>Test Login & Dashboard Access</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #007cba; color: white; border: none; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff0000; }
        .success { background: #e6ffe6; border: 1px solid #00ff00; }
        .session-key { font-weight: bold; color: #007cba; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Debug Session Key Login</h1>
        
        <h2>Step 1: Login untuk Generate Session Key</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="admin@gmail.com" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="123" placeholder="Enter password">
        </div>
        <button onclick="testLogin()">🚀 Test Login</button>
        
        <div id="loginResult" class="result" style="display: none;"></div>
        
        <h2>Step 2: Test Session Key</h2>
        <div class="form-group">
            <label>Session Key (akan otomatis terisi setelah login):</label>
            <input type="text" id="sessionKey" placeholder="Session key dari login response">
        </div>
        <button onclick="testSessionKey()">🔍 Test Session Key</button>
        <button onclick="testDashboardAccess()">🎯 Test Dashboard Access</button>
        
        <div id="sessionResult" class="result" style="display: none;"></div>
    </div>

    <script>
        const BASE_URL = 'http://202.10.41.215';
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Testing login...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Login Berhasil!</h3>
                        <p><strong>User:</strong> ${data.data.user.name} (${data.data.user.email})</p>
                        <p><strong>Role:</strong> ${data.data.user.role || 'user'}</p>
                        <p><strong>Token:</strong> ${data.data.token.substring(0, 20)}...</p>
                        <p><strong>Session Key:</strong> <span class="session-key">${data.data.session_key}</span></p>
                        <p><strong>Expires:</strong> ${data.data.expires_at}</p>
                    `;
                    
                    // Auto fill session key
                    document.getElementById('sessionKey').value = data.data.session_key;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Login Gagal!</h3>
                        <p><strong>Error:</strong> ${data.message}</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
        
        async function testSessionKey() {
            const sessionKey = document.getElementById('sessionKey').value;
            const resultDiv = document.getElementById('sessionResult');
            
            if (!sessionKey) {
                alert('Please enter session key or login first!');
                return;
            }
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Testing session key...';
            resultDiv.className = 'result';
            
            try {
                // Test debug endpoint
                const response = await fetch(`${BASE_URL}/debug-session/${sessionKey}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.found) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Session Key Valid!</h3>
                        <p><strong>Session Key:</strong> ${data.session_key}</p>
                        <p><strong>User ID:</strong> ${data.data.user_id}</p>
                        <p><strong>Email:</strong> ${data.data.email}</p>
                        <p><strong>Name:</strong> ${data.data.name}</p>
                        <p><strong>Logged in at:</strong> ${data.data.logged_in_at}</p>
                        <p><strong>Expires at:</strong> ${data.data.expires_at}</p>
                        <p><strong>Cache Driver:</strong> ${data.cache_driver}</p>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Session Key Tidak Ditemukan!</h3>
                        <p><strong>Session Key:</strong> ${sessionKey}</p>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <p><strong>Cache Driver:</strong> ${data.cache_driver}</p>
                        <p><strong>Solusi:</strong> Login ulang untuk generate session key baru</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
        
        async function testDashboardAccess() {
            const sessionKey = document.getElementById('sessionKey').value;
            
            if (!sessionKey) {
                alert('Please enter session key or login first!');
                return;
            }
            
            // Update result first
            const resultDiv = document.getElementById('sessionResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <h3>🎯 Dashboard Access Test</h3>
                <p><strong>URL:</strong> ${BASE_URL}/dashboard?session_key=${sessionKey}</p>
                <p><strong>Status:</strong> ⏳ Redirecting to dashboard...</p>
                <p><strong>Expected:</strong> Auto-login dan redirect ke dashboard sesuai role</p>
                <p><strong>Note:</strong> Halaman akan redirect otomatis dalam 2 detik</p>
            `;
            resultDiv.className = 'result';
            
            // Redirect after 2 seconds
            setTimeout(() => {
                const dashboardUrl = `${BASE_URL}/dashboard?session_key=${sessionKey}`;
                window.location.href = dashboardUrl;
            }, 2000);
        }
    </script>
</body>
</html>
