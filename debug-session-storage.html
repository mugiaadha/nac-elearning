<!DOCTYPE html>
<html>
<head>
    <title>Test Login dengan Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; }
        .form-group { margin: 10px 0; }
        label { display: block; margin-bottom: 5px; }
        input, button { width: 100%; padding: 10px; margin-bottom: 10px; }
        button { background: #007cba; color: white; border: none; cursor: pointer; }
        .result { margin: 20px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; }
        .error { background: #ffe6e6; border: 1px solid #ff0000; }
        .success { background: #e6ffe6; border: 1px solid #00ff00; }
        .session-key { font-weight: bold; color: #007cba; word-break: break-all; }
        .debug-info { background: #f0f8ff; border: 1px solid #0066cc; margin: 10px 0; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Debug Session Key Issue</h1>
        
        <div class="debug-info">
            <h3>🔍 Current Issue:</h3>
            <p>Session key generated tapi tidak tersimpan di cache atau langsung expired</p>
            <p><strong>Cache Driver:</strong> file</p>
            <p><strong>Server:</strong> localhost:8000</p>
        </div>
        
        <h2>Step 1: Test Login dan Check Session Key</h2>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email" value="admin@gmail.com">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="123">
        </div>
        <button onclick="testLogin()">🚀 Login dan Generate Session Key</button>
        
        <div id="loginResult" class="result" style="display: none;"></div>
        
        <h2>Step 2: Immediate Session Key Verification</h2>
        <button onclick="testLastSessionKey()" id="testButton" disabled>🔍 Test Session Key yang Baru</button>
        
        <div id="sessionResult" class="result" style="display: none;"></div>
        
        <h2>Step 3: Manual Session Key Test</h2>
        <div class="form-group">
            <label>Session Key Manual:</label>
            <input type="text" id="manualSessionKey" placeholder="Paste session key di sini">
        </div>
        <button onclick="testManualSessionKey()">🔍 Test Manual Session Key</button>
        
        <div id="manualResult" class="result" style="display: none;"></div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        let lastSessionKey = '';
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Testing login...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    lastSessionKey = data.data.session_key;
                    
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Login Berhasil!</h3>
                        <p><strong>User:</strong> ${data.data.user.name} (${data.data.user.email})</p>
                        <p><strong>Role:</strong> ${data.data.user.role || 'user'}</p>
                        <p><strong>Session Key:</strong> <span class="session-key">${data.data.session_key}</span></p>
                        <p><strong>Expires:</strong> ${data.data.expires_at}</p>
                        <p><strong>Next:</strong> Akan test session key dalam 2 detik...</p>
                    `;
                    
                    // Enable test button
                    document.getElementById('testButton').disabled = false;
                    
                    // Auto test session key after 2 seconds
                    setTimeout(() => {
                        testLastSessionKey();
                    }, 2000);
                    
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Login Gagal!</h3>
                        <p><strong>Error:</strong> ${data.message}</p>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
        
        async function testLastSessionKey() {
            if (!lastSessionKey) {
                alert('Please login first to get session key!');
                return;
            }
            
            await testSessionKey(lastSessionKey, 'sessionResult');
        }
        
        async function testManualSessionKey() {
            const sessionKey = document.getElementById('manualSessionKey').value;
            if (!sessionKey) {
                alert('Please enter session key!');
                return;
            }
            
            await testSessionKey(sessionKey, 'manualResult');
        }
        
        async function testSessionKey(sessionKey, resultDivId) {
            const resultDiv = document.getElementById(resultDivId);
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '⏳ Testing session key...';
            resultDiv.className = 'result';
            
            try {
                const response = await fetch(`${BASE_URL}/debug-session/${sessionKey}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (data.found) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>✅ Session Key Ditemukan!</h3>
                        <p><strong>Session Key:</strong> <span class="session-key">${data.session_key}</span></p>
                        <p><strong>User ID:</strong> ${data.data.user_id}</p>
                        <p><strong>Email:</strong> ${data.data.email}</p>
                        <p><strong>Name:</strong> ${data.data.name}</p>
                        <p><strong>Role:</strong> ${data.data.role}</p>
                        <p><strong>Logged in at:</strong> ${data.data.logged_in_at}</p>
                        <p><strong>Expires at:</strong> ${data.data.expires_at}</p>
                        
                        <div class="debug-info">
                            <strong>✅ SESSION KEY VALID! Bisa test dashboard:</strong><br>
                            <a href="${BASE_URL}/dashboard?session_key=${sessionKey}" target="_blank">
                                ${BASE_URL}/dashboard?session_key=${sessionKey}
                            </a>
                        </div>
                    `;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>❌ Session Key Tidak Ditemukan!</h3>
                        <p><strong>Session Key:</strong> <span class="session-key">${sessionKey}</span></p>
                        <p><strong>Message:</strong> ${data.message}</p>
                        <p><strong>Cache Driver:</strong> ${data.cache_driver}</p>
                        
                        <div class="debug-info">
                            <strong>🔍 Possible Issues:</strong>
                            <ul>
                                <li>Session key expired immediately after creation</li>
                                <li>Cache storage issue</li>
                                <li>Different session key format</li>
                                <li>Time sync issue between storage and retrieval</li>
                            </ul>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>❌ Network Error!</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
